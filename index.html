<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulados das Provas 2026</title>
  
  <!-- PWA Manifest e Theme (Trazidos do index-4) -->
  <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22MedHub%20Simulado%22,%22short_name%22:%22MedHub%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#f8fafc%22,%22theme_color%22:%22#6d28d9%22}">
  <meta name="theme-color" content="#6d28d9">

  <!-- Tipografia: Plus Jakarta Sans (UI do index-5) & Lora (Textos Clínicos do index-4) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Ícones -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Bibliotecas de Funcionalidades (Trazidas do index-4) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Arquivo CSS Externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- BARRA LATERAL (SIDEBAR) do index-5 -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="ph-fill ph-stethoscope"></i> MedHub
      </div>
      <div class="nav-menu">
        <button class="nav-item active" onclick="voltarParaInicio()"><i class="ph-duotone ph-squares-four"></i> Início</button>
        <button class="nav-item" onclick="abrirCalendarioInterativo()"><i class="ph-duotone ph-calendar-blank"></i> Calendário</button>
        <!-- NOVO BOTAO PARA ESTATÍSTICAS (CHART.JS) -->
        <button class="nav-item" onclick="abrirEstatisticas()"><i class="ph-duotone ph-chart-polar"></i> Desempenho</button>
        <button class="nav-item" onclick="toggleScratchpad()"><i class="ph-duotone ph-note-pencil"></i> Bloco de Notas</button>
        <button class="nav-item" onclick="abrirModalAjuda()"><i class="ph-duotone ph-question"></i> Ajuda & Regras</button>
        <button class="nav-item" onclick="abrirModalConfig()"><i class="ph-duotone ph-sliders-horizontal"></i> Configurações</button>
        <button id="btn-back" class="nav-item danger-hover hidden" onclick="voltar()"><i class="ph-bold ph-arrow-left"></i> Voltar</button>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL (Idêntico ao index-5) -->
    <div class="main-content">
      <header class="top-header">
        <div class="header-titles">
          <span class="badge-tag" id="badge-top">Simulados Med 2026</span>
          <h1 class="brand-title" id="main-title">Simulados das Provas 2026</h1>
          <p class="brand-subtitle" id="main-subtitle">Selecione uma matéria para visualizar e responder às questões.</p>
        </div>
        <button class="btn-omnisearch" onclick="abrirOmnisearch()">
          <i class="ph-bold ph-magnifying-glass"></i> Pesquisar simulado...
        </button>
      </header>

      <div class="dashboard-widgets" id="dashboard-widgets"></div>

      <div id="hub-view">
        <!-- TELA 1: Seleção de Matérias (Index-5 Layout) -->
        <main id="tela-materias">
          <div class="section-header"><i class="ph-bold ph-books"></i> Matérias Disponíveis</div>
          <div class="grid-container bento-active" id="grid-materias">
            <!-- (Cole aqui os blocos .subject-card do index-5) -->
          </div>
        </main>
        
        <!-- TELA NOVA: Estatísticas de Desempenho (Usa o Chart.js do index-4) -->
        <main id="tela-estatisticas" class="hidden">
           <div class="section-header"><i class="ph-bold ph-chart-line-up"></i> Seu Desempenho</div>
           <div class="chart-container" style="background: var(--card-bg); padding: 20px; border-radius: 16px;">
               <canvas id="desempenhoChart"></canvas>
           </div>
        </main>

        <!-- Demais telas (Calendário, Simulação, etc) do index-5... -->
      </div>
    </div>
  </div>

  <!-- Arquivo JS Externo -->
  <script src="script.js"></script>
</body>
</html>

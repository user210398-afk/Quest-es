<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Simulados - MedHub</title>
    
    <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22MedHub%22,%22display%22:%22standalone%22}">
    <meta name="theme-color" content="#3b82f6">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Importação do CSS Modularizado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- LIGHTBOX MODAL PARA IMAGENS -->
    <div class="modal-overlay" id="lightbox-modal" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Zoom Imagem">
    </div>

    <!-- MENU FLUTUANTE DE GRIFO (KINDLE STYLE) -->
    <div id="floating-highlighter-menu" class="floating-menu">
        <button onclick="applyHighlight('yellow')"><i class="ph-fill ph-highlighter"></i> Grifar</button>
        <button onclick="removeHighlight()"><i class="ph-bold ph-eraser"></i> Apagar</button>
    </div>

    <div class="app-layout" id="app-layout">
        <!-- SIDEBAR (Mesmo código do Index original, mantido para navegação) -->
        <aside class="sidebar" id="sidebar">
            <!-- Conteúdo da Sidebar Omitido para brevidade - Cole o conteúdo do seu aside aqui -->
        </aside>

        <main class="main-content" id="main-content">
            <div class="main-container">
                <!-- TELA HOME / HUB CENTRAL -->
                <div class="hub-screen" id="hub-screen">
                    <div class="hub-title" id="hub-dynamic-title">Carregando Simulado...</div>
                    <div class="hub-subtitle" id="hub-dynamic-subtitle">Aguarde enquanto conectamos ao banco de dados.</div>

                    <div class="mode-selector-box">
                        <label><i class="ph-bold ph-target"></i> Modo do Simulado:</label>
                        <select id="game-mode-select">
                            <option value="estudo">📖 Modo Estudo (Gabarito Imediato)</option>
                            <option value="realista">📝 Modo Simulado Realista</option>
                        </select>
                        
                        <div class="hub-filters">
                            <label><input type="checkbox" id="chk-shuffle-q"> Embaralhar Questões</label>
                            <label><input type="number" id="num-random-q" placeholder="Qtd. (deixe vazio para todas)" style="width: 200px; padding: 8px; border-radius: 8px; border: 1px solid var(--border-color);"></label>
                        </div>
                    </div>

                    <button class="btn-hub-action" id="btn-start-sim" onclick="startModule()" disabled>
                        <i class="ph-bold ph-rocket-launch"></i> Iniciar Sessão
                    </button>
                </div>

                <!-- INTERFACE DO QUIZ BENTO GRID -->
                <div class="game-hud" id="game-hud">
                    <div class="hud-header">
                        <div class="hud-top-bar">
                            <span id="quiz-title-badge" style="font-weight: 800; color: var(--purple-primary);">SIMULADO</span>
                            <div class="pomodoro-widget">
                                <button class="tool-btn" onclick="toggleFocusMode()" id="btn-focus" title="Pausar e Focar">
                                    <i class="ph-bold ph-pause"></i> Modo Foco
                                </button>
                            </div>
                        </div>
                        <div class="hud-chips-row">
                            <div class="hud-chip"><i class="ph-bold ph-list-numbers"></i> <span id="hud-q-num">1 / 1</span></div>
                            <div class="hud-chip"><i class="ph-bold ph-timer"></i> <span id="hud-timer">00:00</span></div>
                            <span class="glass-badge-fire" id="combo-badge"><i class="ph-bold ph-fire"></i> COMBO!</span>
                        </div>
                        <div class="hud-progress-container"><div class="hud-progress-bar" id="hud-progress-fill"></div></div>
                    </div>

                    <div class="bento-grid">
                        <!-- BENTO ITEM 1: ENUNCIADO E OPÇÕES -->
                        <div class="bento-card bento-q-card" id="bento-q-card">
                            <div class="q-card-header">
                                <span class="q-category-tag" id="q-category">CATEGORIA</span>
                                <div class="q-integrated-toolbar">
                                    <button class="tool-btn" onclick="readQuestionTTS()"><i class="ph-bold ph-speaker-high"></i> Ouvir</button>
                                    <button class="tool-btn" onclick="toggleFlag()"><i class="ph-bold ph-flag"></i> Dúvida</button>
                                </div>
                            </div>

                            <div class="q-statement" id="q-statement">Carregando...</div>
                            <div id="q-media-box"></div>
                            <div class="options-group" id="options-group"></div>

                            <button class="btn-confirm" id="btn-confirm" onclick="confirmAnswer()">Confirmar Resposta</button>

                            <div class="nav-btns-inline">
                                <button class="action-btn action-btn-secondary" onclick="prevQuestion()">← Anterior</button>
                                <button class="action-btn" id="btn-next" onclick="nextQuestion()">Próxima →</button>
                            </div>

                            <div class="explanation-panel" id="explanation-panel">
                                <button class="btn-add-flashcard" onclick="addCurrentToFlashcards()"><i class="ph-bold ph-cards"></i> Flashcard</button>
                                <div id="exp-body"></div>
                            </div>
                        </div>

                        <!-- BENTO ITEM 2, 3, 4: Gráfico, Notas e Grade -->
                        <div class="bento-card bento-chart-card"><canvas id="realtimeChart"></canvas></div>
                        <div class="bento-card bento-notes-card"><textarea id="q-notes" class="notes-textarea" placeholder="Anotações..."></textarea></div>
                        <div class="bento-card bento-grid-card"><div class="nav-grid" id="nav-grid"></div></div>
                    </div>
                </div>

                <!-- TELAS DE RELATÓRIO E FLASHCARDS (Mantidas as estruturas, renderizadas via JS) -->
                <div class="report-screen" id="report-screen">
                    <div class="report-header-title">Diagnóstico Final</div>
                    <canvas id="radarChart" style="max-width: 400px; margin: 0 auto; height: 300px;"></canvas>
                    <div id="badges-container" class="badges-grid"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Importação do Motor JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
